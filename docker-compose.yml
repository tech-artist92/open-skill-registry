version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: osr
      POSTGRES_PASSWORD: osr_secret
      POSTGRES_DB: osr
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  server:
    build: .
    ports:
      - "8080:8080"
    environment:
      - OSR_DATABASE__URL=postgresql+asyncpg://osr:osr_secret@db:5432/osr
      - OSR_CACHE__URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    command: uvicorn open_skill_registry.server.main:app --host 0.0.0.0 --port 8080 --reload
    volumes:
      - ./src:/app/src

volumes:
  postgres_data:
