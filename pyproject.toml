[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "open-skill-registry"
version = "0.1.0"
description = "Open-source skill registry ecosystem for discovering, distributing, and dynamically loading AI agent skills"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Open Skill Registry Contributors" },
]
keywords = [
    "ai",
    "ai-agents",
    "agent-skills",
    "skill-registry",
    "mcp",
    "model-context-protocol",
    "sep-2640",
    "google-adk",
    "langchain",
    "openai",
    "crewai",
    "cursor",
    "claude-desktop",
    "semantic-search",
    "vector-search",
    "fastembed",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi",
    "uvicorn",
    "sqlmodel",
    "sqlalchemy[asyncio]",
    "asyncpg",
    "aiosqlite>=0.20.0",
    "pgvector",
    "fastembed>=0.3.0",
    "numpy>=1.24.0",
    "pyyaml>=6.0.1",
    "redis",
    "typer",
    "rich",
    "httpx",
    "pydantic>=2.8.0",
    "pydantic-settings",
    "python-multipart>=0.0.9",
]

[project.urls]
Homepage = "https://github.com/tech-artist92/open-skill-registry"
Repository = "https://github.com/tech-artist92/open-skill-registry"
Documentation = "https://github.com/tech-artist92/open-skill-registry#readme"
"Bug Tracker" = "https://github.com/tech-artist92/open-skill-registry/issues"
Changelog = "https://github.com/tech-artist92/open-skill-registry/releases"

[project.optional-dependencies]
cli = [
    "typer",
    "rich",
    "httpx",
]
server = [
    "fastapi",
    "uvicorn",
    "redis",
    "asyncpg",
    "pgvector",
]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-asyncio",
]
all = [
    "open-skill-registry[cli,server,dev]",
]

[project.scripts]
osr = "open_skill_registry.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/open_skill_registry"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "E501", "E712", "B904", "E402"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
